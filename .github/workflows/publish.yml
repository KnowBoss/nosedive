name: Publish

# Push to main -> the committed bundle, verified, published as a dev build (yyyy.m.d-utcmillis, npm tag "dev").
# Manual dispatch -> a published version tagged "latest", with no rebuild.
# Auth is npm trusted publishing (OIDC): KnowBoss/nosedive, this file, no environment, publish and dist-tag allowed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: A published version to tag latest, as 2026.11.8-1794123456789
        required: true

permissions:
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; later 11.x broke its provenance path, so pin the known-good minimum.
      - name: Update npm
        run: npm install -g npm@11.5.1
      - name: Verify the bundle
        run: npm run verify
      - name: Stamp the dev version
        run: |
          set -euo pipefail
          version="$(node -e 'const d = new Date(); console.log(`${d.getUTCFullYear()}.${d.getUTCMonth() + 1}.${d.getUTCDate()}-${d.getTime()}`)')"
          npm version --no-git-tag-version "$version"
          echo "Publishing nosedive@$version"
      - run: npm publish --tag dev --access public

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install -g npm@11.5.1
      - name: Tag it latest
        run: npm dist-tag add "nosedive@${{ inputs.version }}" latest
