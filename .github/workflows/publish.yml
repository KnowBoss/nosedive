name: Publish

# Push to main -> the committed bundle, verified, published as a dev build (yyyy.m.d-utcmillis, npm tag "dev"). A push that touches only docs/ is skipped.
# Nothing here moves "latest": `nosedive promote`, in nosedive-dev, tags a dev build latest from the pilot's machine once a demo of it has passed.
# Auth is npm trusted publishing (OIDC): KnowBoss/nosedive, this file, no environment, publish allowed.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**

permissions:
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; later 11.x broke its provenance path, so pin the known-good minimum.
      - name: Update npm
        run: npm install -g npm@11.5.1
      - name: Verify the bundle
        run: npm run verify
      - name: Stamp the dev version
        run: |
          set -euo pipefail
          version="$(node -e 'const d = new Date(); console.log(`${d.getUTCFullYear()}.${d.getUTCMonth() + 1}.${d.getUTCDate()}-${d.getTime()}`)')"
          npm version --no-git-tag-version "$version"
          echo "Publishing nosedive@$version"
      - run: npm publish --tag dev --access public
